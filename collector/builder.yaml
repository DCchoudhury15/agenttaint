dist:
  name: agentward-collector
  module: github.com/DCchoudhury15/agentward/collector
  go: "1.26"
  output_path: ./build
  description: AgentWard sidecar collector, OTLP receiver + taint_policy (Rego) processor + OTLP exporter to SigNoz.

# Component versions aligned with the collector core the builder ships (v0.160.0).
receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.160.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.160.0
  # Custom processor, local module, pulled in via the replace below.
  - gomod: github.com/DCchoudhury15/agentward/collector/processor/taintpolicy v0.0.0
    import: github.com/DCchoudhury15/agentward/collector/processor/taintpolicy

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.160.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.160.0

replaces:
  - github.com/DCchoudhury15/agentward/collector/processor/taintpolicy => /home/divyanshu/agentward/collector/processor/taintpolicy